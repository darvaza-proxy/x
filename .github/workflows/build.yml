name: Build

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - '**-wip'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: depot-ubuntu-latest
    # Pull requests from the same repository won't trigger this checks as they were already triggered by the push
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'
    - name: Build
      run: make

  vet:
    name: vet (${{ matrix.goos }})
    runs-on: depot-ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: '**/go.sum'
    # make vet compiles every module's packages and tests for the target
    # GOOS via `go vet`, without running them — a compile check that,
    # for a non-host GOOS, is the only cross-platform gate we have.
    - name: make vet
      env:
        GOOS: ${{ matrix.goos }}
      run: make vet
